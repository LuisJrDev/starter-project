name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #icon
  ionicons: ^0.1.2

  #state management
  flutter_bloc: ^8.1.2

  #comparing dart objects
  equatable: ^2.0.5

  #service locator
  get_it: ^7.6.0
  
  #dateFormat
  intl: ^0.18.1

  #Database
  floor: any
  sqflite: ^2.3.2

  #make request to api
  retrofit: ^3.0.1
  dio: ^4.0.6

  # Firebase
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.3
  firebase_storage: ^11.5.5


  #Hooks
  flutter_hooks: ^0.18.3

  #chached image 
  cached_network_image: ^3.2.0

  #pick article thumbnails from the gallery
  image_picker: ^1.2.0

  #remember the journalist's signature between sessions
  shared_preferences: ^2.5.3

  #render article content (flutter_markdown is discontinued, this is its official successor)
  flutter_markdown_plus: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  retrofit_generator: 3.0.1+1
  floor_generator: 1.2.0
  build_runner: 2.1.2
  #mocks for unit tests (bloc_test is incompatible with retrofit_generator's analyzer ^2.0.0)
  mocktail: ^1.0.5
  #in-memory Firestore and Storage for data source tests
  fake_cloud_firestore: ^2.5.2
  firebase_storage_mocks: ^0.6.1
  

flutter:

  uses-material-design: true

 
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
